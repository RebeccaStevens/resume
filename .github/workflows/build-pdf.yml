name: Build PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libjpeg-dev libopenjp2-7-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js & SVGO
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install SVGO
        run: npm install -g svgo

      - name: Compile Resume PDF
        run: python3 src/render.py

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Rebecca Stevens - Resume
          path: "Rebecca Stevens - Resume.pdf"
          if-no-files-found: error

      - name: Publish Latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Resume Build"
          body: "Automated build of Rebecca Stevens' resume compiled from the `main` branch."
          files: "Rebecca Stevens - Resume.pdf"
