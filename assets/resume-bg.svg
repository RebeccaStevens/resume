<svg
  xmlns="http://www.w3.org/2000/svg"
  id="resume-background"
  width="210mm"
  height="297mm"
  viewBox="0 0 210 297"
  xml:space="preserve"
>
  <defs id="background-defs">
    <!-- Styles -->
    <style>
      .stop-purple {
        stop-color: #800080;
      }
      #stop-0 {
        stop-opacity: 0.45;
      }
      #stop-1 {
        stop-opacity: 0.40;
      }
      #stop-2 {
        stop-opacity: 0.12;
      }
      #stop-3 {
        stop-opacity: 0.02;
      }
      #stop-4 {
        stop-opacity: 0;
      }
      #bg-base-canvas {
        fill: #e0f2fe;
      }
      .page-ellipse {
        fill: #ffffff;
        stroke: #800080;
        stroke-width: 3;
      }
      #bg-gradient-accent-overlay {
        fill: url(#gradient-purple-accent);
      }
    </style>

    <!-- Ellipse shape -->
    <ellipse
      id="ellipse-shape"
      cx="55"
      cy="178"
      rx="210"
      ry="160"
      transform="rotate(-20)"
    />

    <!-- Gradient -->
    <linearGradient
      id="gradient-purple-accent"
      x1="0"
      y1="0"
      x2="15"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop id="stop-0" class="stop-purple" offset="0" />
      <stop id="stop-1" class="stop-purple" offset="0.15" />
      <stop id="stop-2" class="stop-purple" offset="0.5" />
      <stop id="stop-3" class="stop-purple" offset="0.8" />
      <stop id="stop-4" class="stop-purple" offset="1" />
    </linearGradient>

    <!-- Ellipse clip -->
    <clipPath id="clip-page-ellipse">
      <use
        id="clip-page-ellipse-use"
        href="#ellipse-shape"
      />
    </clipPath>

    <!-- A4 clip -->
    <clipPath id="page-artbox">
      <rect id="page-artbox-rect" x="0" y="0" width="210" height="297" />
    </clipPath>
  </defs>

  <g id="page-content-wrapper" clip-path="url(#page-artbox)">
    <g id="background-layer">
      <!-- Canvas -->
      <rect
        id="bg-base-canvas"
        x="0"
        y="0"
        width="210"
        height="297"
      />

      <!-- Ellipse -->
      <use
        id="bg-page-body-ellipse"
        class="page-ellipse"
        href="#ellipse-shape"
      />

      <!-- Gradient overlay -->
      <rect
        id="bg-gradient-accent-overlay"
        x="0"
        y="0"
        width="210"
        height="297"
        clip-path="url(#clip-page-ellipse)"
      />
    </g>
  </g>
</svg>